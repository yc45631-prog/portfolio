{% extends 'portfolio/base.html' %}
{% load static %}

{% block content %}
<section class="article-detail section mt-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        {% if article.image %}
          <img src="{{ article.image.url }}" class="img-fluid rounded mb-4 w-100 shadow" alt="{{ article.title }}">
        {% endif %}
        
        <h1 class="fw-bold">{{ article.title }}</h1>
        <p class="text-muted">Published: {{ article.published_date }}</p>
        <hr>
        
        <div class="article-body mt-4" style="line-height: 1.8; font-size: 1.1rem;">
          {{ article.content|linebreaks }}
        </div>
        
        <div class="mt-5">
          <a href="{% url 'articles' %}" class="btn btn-secondary">&larr; Back to Articles</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
