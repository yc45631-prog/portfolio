{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Christian Yousef - Portfolio</title>
  
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">
</head>

<body class="index-page">
  <header id="header" class="header d-flex flex-column justify-content-center">
    <i class="header-toggle d-xl-none bi bi-list"></i>
    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="{% url 'home' %}"><i class="bi bi-house navicon"></i><span>Home</span></a></li>
        <li><a href="{% url 'home' %}#about"><i class="bi bi-person navicon"></i><span>About</span></a></li>
        <li><a href="{% url 'home' %}#resume"><i class="bi bi-file-earmark-text navicon"></i><span>Resume</span></a></li>
        <li><a href="{% url 'projects' %}"><i class="bi bi-hdd-stack navicon"></i><span>Projects</span></a></li>
        <li><a href="{% url 'articles' %}"><i class="bi bi-journal-richtext navicon"></i><span>Articles</span></a></li>
        <li><a href="{% url 'home' %}#contact"><i class="bi bi-envelope navicon"></i><span>Contact</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer id="footer" class="footer position-relative light-background">
    <div class="container">
      <div class="copyright">
        &copy; Copyright <strong><span>Christian Yousef</span></strong>. All Rights Reserved
      </div>
    </div>
  </footer>

  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>
  <script src="{% static 'assets/vendor/typed.js/typed.umd.js' %}"></script>
</body>
</html>
